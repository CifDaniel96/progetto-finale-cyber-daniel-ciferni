<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Bonus 2 - Clickjacking test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        .page {
            max-width: 1100px;
            margin: 40px auto;
            padding: 24px;
        }

        .card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .frame-wrapper {
            position: relative;
            width: 100%;
            height: 650px;
            border: 4px solid #ef4444;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0.55;
        }

        .overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            padding: 18px;
            background: rgba(239, 68, 68, 0.92);
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
        }

        .note {
            color: #d1d5db;
            line-height: 1.6;
        }

        code {
            background: #374151;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">
            <h1>Bonus 2 - Clickjacking test</h1>
            <p class="note">
                Questa pagina simula una pagina esterna che prova a caricare
                <code>cyber.blog</code> dentro un iframe.
                Se il sito viene visualizzato nel riquadro, significa che mancano header anti-clickjacking.
            </p>
        </section>

        <section class="frame-wrapper">
            <div class="overlay">
                Pagina esterna controllata — sotto è visibile il sito target dentro un iframe
            </div>

            <iframe src="http://cyber.blog:8000/login?bonus2_after_test=1"></iframe>
        </section>
    </main>
</body>

</html>
